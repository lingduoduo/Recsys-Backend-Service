apiVersion: apps/v1
kind: Deployment
metadata:
  name: recsys-online-serving
  namespace: recsys
  labels:
    app: recsys-online-serving
spec:
  replicas: 2
  selector:
    matchLabels:
      app: recsys-online-serving
  template:
    metadata:
      labels:
        app: recsys-online-serving
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "7010"
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: recsys-online-serving
      containers:
        - name: online-serving
          image: recsys-backend-service:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: recsys-config
          env:
            - name: RECSYS_MAIN_CLASS
              value: com.recsys.api.online.OnlinePredictionServer
            - name: ONLINE_DEMO_PORT
              value: "7010"
            - name: RECOMMENDATION_CURSOR_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: recsys-secrets
                  key: recommendation-cursor-signing-key
            - name: RECOMMENDATION_CURSOR_PREVIOUS_KEY
              valueFrom:
                secretKeyRef:
                  name: recsys-secrets
                  key: recommendation-cursor-previous-key
                  optional: true
            # Operator token for the introspection/bulk surfaces (POST /shards/topology,
            # GET /shards/shard, GET /online/ops). When unset these surfaces fail closed (403).
            # optional: true keeps the pod schedulable before the Secret is provisioned; create it
            # out-of-band to enable the surfaces (see docs/runbooks/gateway-auth.md).
            - name: SHARD_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: recsys-online-admin
                  key: admin-token
                  optional: true
            # AWS: OnlinePredictionServer builds its event publisher from
            # AsyncEventPublisherFactory.fromEnvironment("ONLINE_EVENTS"), which constructs an
            # SqsClient and an SqsAsyncEventPublisher — i.e. calls sqs:SendMessageBatch, which is
            # the only send the batching publisher ever makes — when ONLINE_EVENTS_SQS_ENABLED=true
            # and ONLINE_EVENTS_SQS_QUEUE_URL is non-blank. Both default off just below, so nothing
            # is broken today; but this Deployment has no serviceAccountName, so on EKS it runs
            # under the namespace default ServiceAccount, which is bound to no IAM role. Enabling
            # SQS delivery needs an IRSA ServiceAccount and a role granting sqs:SendMessageBatch on
            # that queue, scoped to its ARN, and neither exists yet. Kafka delivery
            # (ONLINE_EVENTS_KAFKA_*) is unaffected — it uses no AWS credentials.
            - name: ONLINE_EVENTS_SQS_ENABLED
              value: "false"
            - name: ONLINE_EVENTS_SQS_QUEUE_URL
              value: ""
            - name: REDIS_POOL_MAX_TOTAL
              value: "64"
            - name: REDIS_POOL_MAX_IDLE
              value: "16"
            - name: REDIS_POOL_MIN_IDLE
              value: "4"
            - name: REDIS_POOL_MAX_WAIT_MS
              value: "100"
            - name: REDIS_TIMEOUT_MS
              value: "200"
            # -XX:+ExitOnOutOfMemoryError: an OOM'd JVM keeps serving (500s, then 200s once GC
            # recovers) with no liveness probe that notices, so nothing restarts it. Exiting
            # skips the graceful drain deliberately — see 18_Fault_Tolerance.md §9.5.
            - name: JAVA_OPTS
              value: "-Xms512m -Xmx1g -XX:+ExitOnOutOfMemoryError"
            # Splunk HEC log shipping. Inert until the recsys-splunk Secret exists, so
            # optional: true keeps pods schedulable before it is provisioned — same pattern
            # as recsys-online-admin / SHARD_ADMIN_TOKEN. See
            # docs/runbooks/splunk-hec-logging.md.
            - name: SPLUNK_SERVICE_NAME
              value: "online-serving"
            - name: SPLUNK_HEC_URL
              value: "http://splunk:8088/services/collector/event"
            - name: SPLUNK_HEC_TOKEN
              valueFrom:
                secretKeyRef:
                  name: recsys-splunk
                  key: hec-token
                  optional: true
            # Authenticates as the `online` ACL user, not `default`. See
            # k8s/base/redis-users.acl.template for what this user may write. Unset falls back to
            # a legacy default-user AUTH (LettuceClientFactory:220), so a cluster whose Secret
            # predates the ACL rollout keeps working rather than failing closed at startup.
            - name: REDIS_USERNAME
              value: "online"
            # Redis AUTH. optional: true keeps the pod schedulable before the Secret exists —
            # LettuceClientFactory then refuses to start with a message naming this key, which is
            # a readable failure rather than a pod stuck Pending with an empty log.
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: recsys-secrets
                  key: redis-online-password
                  optional: true
          ports:
            - name: http
              containerPort: 7010
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            failureThreshold: 24
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1536Mi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: recsys-online-serving
  namespace: recsys
  # ServiceMonitor.spec.selector matches THESE labels — not spec.selector below, which
  # selects pods. Without them the ServiceMonitor matches nothing and scrapes nothing.
  labels:
    app: recsys-online-serving
spec:
  type: ClusterIP
  selector:
    app: recsys-online-serving
  ports:
    - name: http
      port: 7010
      targetPort: http
