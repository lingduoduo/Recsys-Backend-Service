apiVersion: apps/v1
kind: Deployment
metadata:
  name: recsys-catalog-serving
  namespace: recsys
  labels:
    app: recsys-catalog-serving
spec:
  replicas: 2
  selector:
    matchLabels:
      app: recsys-catalog-serving
  template:
    metadata:
      labels:
        app: recsys-catalog-serving
      annotations:
        # ServiceMonitor is the authoritative scrape-discovery path.
        prometheus.io/scrape: "false"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "6010"
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: recsys-catalog-serving
      containers:
        - name: catalog-serving
          image: recsys-backend-service:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: recsys-config
          env:
            - name: RECSYS_MAIN_CLASS
              value: com.recsys.api.serving.RecSysServer
            - name: PORT
              value: "6010"
            - name: RECOMMENDATION_CURSOR_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: recsys-secrets
                  key: recommendation-cursor-signing-key
            - name: RECOMMENDATION_CURSOR_PREVIOUS_KEY
              valueFrom:
                secretKeyRef:
                  name: recsys-secrets
                  key: recommendation-cursor-previous-key
                  optional: true
            # Must stay <= RECALL_CHANNEL_TIMEOUT_MS (default 200). The channel timeout is
            # applied as CompletableFuture.orTimeout, which completes the *caller's* future
            # and neither cancels nor interrupts the task already running on the recall
            # bulkhead — so a stalled Redis holds a bulkhead thread for the full command
            # timeout, not for 200ms. Left unset, this defaults to 2000 (LettuceClientFactory
            # .DEFAULT_TIMEOUT_MS) and the bulkhead drains 10x slower than the budget above it
            # implies. online-serving pins the same value; model-serving caps it in code
            # instead (ModelRuntimeProvider.RECALL_REDIS_TIMEOUT_MS = 150). Pinned by
            # CatalogRedisTimeoutManifestTest; see docs/system_design/17_Scalability.md §2.
            - name: REDIS_TIMEOUT_MS
              value: "200"
            # -XX:+ExitOnOutOfMemoryError: an OOM'd JVM keeps serving (500s, then 200s once GC
            # recovers) with no liveness probe that notices, so nothing restarts it. Exiting
            # skips the graceful drain deliberately — see 18_Fault_Tolerance.md §9.5.
            - name: JAVA_OPTS
              value: "-Xms512m -Xmx1g -XX:+ExitOnOutOfMemoryError"
            # Splunk HEC log shipping. Inert until the recsys-splunk Secret exists, so
            # optional: true keeps pods schedulable before it is provisioned — same pattern
            # as recsys-online-admin / SHARD_ADMIN_TOKEN. See
            # docs/runbooks/splunk-hec-logging.md.
            - name: SPLUNK_SERVICE_NAME
              value: "recsys-serving"
            - name: SPLUNK_HEC_URL
              value: "http://splunk:8088/services/collector/event"
            - name: SPLUNK_HEC_TOKEN
              valueFrom:
                secretKeyRef:
                  name: recsys-splunk
                  key: hec-token
                  optional: true
            # Authenticates as the `catalog` ACL user, not `default`. See
            # k8s/base/redis-users.acl.template for what this user may write. Unset falls back to
            # a legacy default-user AUTH (LettuceClientFactory:220), so a cluster whose Secret
            # predates the ACL rollout keeps working rather than failing closed at startup.
            - name: REDIS_USERNAME
              value: "catalog"
            # Redis AUTH. optional: true keeps the pod schedulable before the Secret exists —
            # LettuceClientFactory then refuses to start with a message naming this key, which is
            # a readable failure rather than a pod stuck Pending with an empty log.
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: recsys-secrets
                  key: redis-catalog-password
                  optional: true
          ports:
            - name: http
              containerPort: 6010
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 24
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1536Mi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: recsys-catalog-serving
  namespace: recsys
  labels:
    app: recsys-catalog-serving
spec:
  type: ClusterIP
  selector:
    app: recsys-catalog-serving
  ports:
    - name: http
      port: 6010
      targetPort: http
