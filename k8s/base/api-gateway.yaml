apiVersion: apps/v1
kind: Deployment
metadata:
  name: recsys-api-gateway
  namespace: recsys
  labels:
    app: recsys-api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: recsys-api-gateway
  template:
    metadata:
      labels:
        app: recsys-api-gateway
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: recsys-api-gateway
      containers:
        - name: api-gateway
          image: recsys-backend-service:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: recsys-config
          env:
            - name: RECSYS_MAIN_CLASS
              value: com.recsys.api.gateway.MicroserviceGatewayServer
            - name: GATEWAY_PORT
              value: "8010"
            # -XX:+ExitOnOutOfMemoryError: an OOM'd JVM keeps serving (500s, then 200s once GC
            # recovers) with no liveness probe that notices, so nothing restarts it. Exiting
            # skips the graceful drain deliberately — see 18_Fault_Tolerance.md §9.5.
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx512m -XX:+ExitOnOutOfMemoryError"
            # Origin lockdown. Absent until the CDN rollout reaches step 4, at which point the
            # Secret is created out-of-band (docs/runbooks/cdn-operations.md). optional: true keeps
            # the pod schedulable before then and in local/base deploys with no CDN.
            - name: GATEWAY_ORIGIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: recsys-gateway-origin-secret
                  key: secret
                  optional: true
            # Operator token for the control-plane routes the gateway now gates: POST
            # /api/catalog/setembedding and the model version activate/rollback/preload endpoints,
            # plus /api/online/online/ops. When unset these fail closed (403) — see
            # docs/system_design/20_AuthN_AuthZ.md and docs/runbooks/gateway-auth.md.
            - name: SHARD_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: recsys-online-admin
                  key: admin-token
                  optional: true
            # Splunk HEC log shipping. Inert until the recsys-splunk Secret exists, so
            # optional: true keeps pods schedulable before it is provisioned — same pattern
            # as recsys-online-admin / SHARD_ADMIN_TOKEN. See
            # docs/runbooks/splunk-hec-logging.md.
            - name: SPLUNK_SERVICE_NAME
              value: "api-gateway"
            - name: SPLUNK_HEC_URL
              value: "http://splunk:8088/services/collector/event"
            - name: SPLUNK_HEC_TOKEN
              valueFrom:
                secretKeyRef:
                  name: recsys-splunk
                  key: hec-token
                  optional: true
            # Authenticates as the `gateway` ACL user, not `default`. See
            # k8s/base/redis-users.acl.template for what this user may write. Unset falls back to
            # a legacy default-user AUTH (LettuceClientFactory:220), so a cluster whose Secret
            # predates the ACL rollout keeps working rather than failing closed at startup.
            - name: REDIS_USERNAME
              value: "gateway"
            # Redis AUTH. optional: true keeps the pod schedulable before the Secret exists —
            # LettuceClientFactory then refuses to start with a message naming this key, which is
            # a readable failure rather than a pod stuck Pending with an empty log.
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: recsys-secrets
                  key: redis-gateway-password
                  optional: true
          ports:
            - name: http
              containerPort: 8010
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          # Startup and liveness ask whether this process is running; /health/live answers only
          # that. Readiness keeps /health, which reports upstream reachability and 503s when an
          # upstream is down — the right answer for "should traffic come here" and the wrong one
          # for "should this container be killed". All three used to point at /health, so an
          # upstream outage restarted every gateway pod and a slow cold start never finished.
          # See 18_Fault_Tolerance.md §9.5 and 09_API_Gateway.md.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 24
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 750m
              memory: 768Mi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: recsys-api-gateway
  namespace: recsys
  # ServiceMonitor.spec.selector matches THESE labels — not spec.selector below, which
  # selects pods. Without them the ServiceMonitor matches nothing and scrapes nothing.
  labels:
    app: recsys-api-gateway
# ClusterIP, deliberately. k8s/base sets GATEWAY_ALLOW_ANONYMOUS=true so the gateway authenticates
# nobody — which is fine for development and is why base keeps the opt-in, since
# GatewayAuthenticator.fromEnvironment refuses to start without a credential source that base does
# not have. What must not follow is exposure: this Service used to be a LoadBalancer annotated
# internet-facing, which put an unauthenticated gateway on the internet, and because the
# authenticator short-circuits when disabled, PROTECTED_PREFIXES was not consulted either.
# Reach it locally with `kubectl port-forward svc/recsys-api-gateway 8010:80 -n recsys`.
# Internet-facing exposure belongs in an overlay that also sets GATEWAY_ALLOW_ANONYMOUS=false;
# GatewayExposureManifestTest fails the build if the two are ever paired again.
spec:
  type: ClusterIP
  selector:
    app: recsys-api-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
