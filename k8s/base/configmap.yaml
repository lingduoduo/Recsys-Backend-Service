apiVersion: v1
kind: ConfigMap
metadata:
  name: recsys-config
  namespace: recsys
data:
  # No standalone write endpoint in base: static Services cannot follow Sentinel elections.
  # Empty deliberately fails closed if a workload accidentally selects standalone mode.
  # ElastiCache overlays replace this with their managed primary endpoint.
  REDIS_HOST: ""
  REDIS_PORT: "6379"
  REDIS_MODE: "sentinel"
  REDIS_SENTINEL_MASTER: "mymaster"
  REDIS_SENTINEL_NODES: "redis-sentinel-0.redis-sentinel-headless.recsys.svc.cluster.local:26379,redis-sentinel-1.redis-sentinel-headless.recsys.svc.cluster.local:26379,redis-sentinel-2.redis-sentinel-headless.recsys.svc.cluster.local:26379"
  CATALOG_SERVICE_URL: "http://recsys-catalog-serving:6010"
  MODEL_SERVICE_URL: "http://recsys-model-serving:8080"
  ONLINE_SERVICE_URL: "http://recsys-online-serving:7010"
  USER_PROFILE_SERVICE_URL: "http://recsys-catalog-serving:6010"
  MOVIE_METADATA_SERVICE_URL: "http://recsys-catalog-serving:6010"
  FEATURE_SERVICE_URL: "http://recsys-online-serving:7010"
  RECOMMENDATION_RETRIEVAL_SERVICE_URL: "http://recsys-model-serving:8080"
  RANKING_SERVICE_URL: "http://recsys-model-serving:8080"
  LLM_SERVICE_URL: "http://ollama:11434"
  LLM_EXPLANATION_SERVICE_URL: "http://ollama:11434"
  # Cognito JWT auth (blank issuer = disabled; gateway then uses API keys only).
  # GATEWAY_COGNITO_AUDIENCE is REQUIRED when GATEWAY_COGNITO_ISSUER is set (startup fails otherwise).
  GATEWAY_COGNITO_ISSUER: ""
  GATEWAY_COGNITO_AUDIENCE: ""
  GATEWAY_COGNITO_TOKEN_USE: "access"
  AGENT_WORKFLOW_SERVICE_URL: "http://recsys-model-serving:8080"
  OBSERVABILITY_SERVICE_URL: "http://recsys-model-serving:8080"
  GATEWAY_TIMEOUT_MS: "3000"
  # Recycle each gateway->backend connection after this age so kube-proxy re-picks a pod; without it
  # one HTTP/2 connection pins a gateway pod to one backend pod. 0 disables. See 01_Load_Balancing.md.
  GATEWAY_UPSTREAM_MAX_CONNECTION_AGE_MS: "30000"
  # Optional API-key auth. Keep unset by default; inject via Secret in production:
  # GATEWAY_API_KEYS: "replace-with-secret"
  # Fail-closed guard: with no GATEWAY_API_KEYS and no GATEWAY_COGNITO_ISSUER the gateway
  # authenticates nobody, so every caller is "anonymous" and any downstream authz gap becomes
  # unauthenticated. The gateway REFUSES to start in that state unless this flag is explicitly
  # "true". Base/local is a dev posture, so it opts in here; EKS overlays flip this to "false"
  # (k8s/eks-shared/configmap-patch.yaml) and supply real auth via Secret.
  GATEWAY_ALLOW_ANONYMOUS: "true"
  # Anonymous-readable paths. The two catalog reads are edge-cached by CloudFront and MUST NOT
  # vary on Authorization — a JWT-keyed cache fragments per user and the hit ratio collapses.
  # Movie metadata and item-to-item similarity are treated as non-sensitive.
  # DANGER: these MUST be the exact paths, never the "/api/catalog" prefix. Public-path matching
  # is prefix-with-boundary (GatewayAuthenticator.java:114-117), so "/api/catalog" would also
  # expose "/api/catalog/user?userId=1", which returns user data.
  # See docs/superpowers/specs/2026-07-14-cdn-edge-acceleration-design.md.
  GATEWAY_PUBLIC_PATHS: "/health,/api/catalog/item,/api/catalog/similar"
  # Twelve months' notice for unversioned /api paths and the backend-oriented alias routes.
  # Unset disables deprecation headers entirely — see docs/system_design/09_API_Gateway.md#the-compatibility-contract.
  GATEWAY_DEPRECATION_SUNSET: "2027-07-27"
  SPRING_APPLICATION_NAME: "recsys-model-serving"
  RECSYS_RECOMMENDATION_CACHE_ENABLED: "true"
  RECSYS_RECOMMENDATION_CACHE_TTL_SECONDS: "300"
  RECSYS_RECOMMENDATION_CACHE_MAX_ENTRIES: "10000"
  # All recommendation-serving workloads/regions share these non-secret cursor settings.
  # Active and previous key material comes from the same recsys-secrets keys in each workload.
  RECOMMENDATION_CURSOR_MAX_AGE_SECONDS: "900"
  # Unsigned "v2:" cursors are refused. Set to "true" only to re-admit cursors issued before
  # 2026-07-27; the legacy path validates no signature, expiry, user binding or query fingerprint.
  RECOMMENDATION_CURSOR_ACCEPT_LEGACY: "false"
  RECOMMENDATION_PAGINATION_MAX_CANDIDATES: "500"
  # Model serving (8080) per-instance admission cap. 8 per two-CPU pod, not 64: each admitted
  # request runs a batched ONNX invocation on one intra-op thread (RECSYS_MODEL_ONNX_* in
  # model-serving.yaml), so 64 in flight against a 2-CPU limit is 32x oversubscription that
  # surfaces as CFS throttling and tail latency, not as more throughput. Excess requests are
  # served from the degraded cache when one exists, else 503 + Retry-After. A safety default,
  # not a measured capacity — raise it only with InferenceLoadTest numbers from this CPU shape.
  RECSYS_HEALTH_MAX_CONCURRENT_REQUESTS: "8"
  RECSYS_HEALTH_MAX_IN_FLIGHT_UTILIZATION: "0.95"
  # RecSys Serving (6010) concurrency admission (mirrors ONLINE_MAX_CONCURRENT_REQUESTS).
  # Guards the recall/ranking routes (/getrecommendation, /v2/recommend, /similar); 429 above the cap.
  CATALOG_MAX_CONCURRENT_REQUESTS: "64"
  CATALOG_DRAIN_UTILIZATION: "0.90"
  # --- Overload protection (see docs/runbooks/overload-protection.md) ---
  # ONLINE_REDIS_RATE_LIMIT_QPS: single GLOBAL cluster-wide ceiling (fixed 1s window; up to
  #   ~2x across a window boundary). GATEWAY_RATE_LIMIT_*: per authenticated caller PER route.
  #   Concurrency gates (*_MAX_CONCURRENT_REQUESTS) are PER instance. Values need load-test validation.
  # Gateway local rate limiting (token-bucket, per gateway replica).
  # Set MODEL_RPS lower: ONNX inference is CPU-heavy and cannot absorb the same burst.
  GATEWAY_RATE_LIMIT_RPS: "100"
  GATEWAY_RATE_LIMIT_BURST: "200"
  GATEWAY_RATE_LIMIT_MODEL_RPS: "50"
  GATEWAY_RATE_LIMIT_MODEL_BURST: "100"
  # Gateway circuit-breaker thresholds (shared across all routes).
  GATEWAY_CB_FAILURE_THRESHOLD: "5"
  GATEWAY_CB_COOLDOWN_MS: "10000"
  # Online-serving Redis rate limiter (cross-instance, fixed-window).
  ONLINE_REDIS_RATE_LIMIT_QPS: "200"
  ONLINE_REDIS_RATE_LIMIT_WINDOW_SECONDS: "1"
  # Local emergency budget used only while Redis limiting is unavailable.
  ONLINE_REDIS_EMERGENCY_LIMIT_ENABLED: "true"
  ONLINE_REDIS_EMERGENCY_RATE_PER_SECOND: "50"
  ONLINE_REDIS_EMERGENCY_BURST: "50"
  ONLINE_REQUEST_TIMEOUT_MS: "500"
  ONLINE_MAX_CONCURRENT_REQUESTS: "64"
  ONLINE_DRAIN_UTILIZATION: "0.90"
  ONLINE_FEATURE_STALE_TTL_MS: "60000"
  ONLINE_TOPK_STALE_TTL_MS: "60000"
  # Optional saga transition publication to SQS. Keep disabled unless a saga events queue
  # and IAM permission are configured for the runtime that creates saga orchestrators.
  SAGA_EVENTS_SQS_ENABLED: "false"
  SAGA_EVENTS_SQS_QUEUE_URL: ""
  SAGA_EVENTS_SQS_BEST_EFFORT: "false"
  # --- Durable eventual consistency (see docs/runbooks/durable-eventual-consistency.md) ---
  # OFF by default. Enable per overlay after applying the Flyway V2/V3 migrations. Secrets
  # MYSQL_PASSWORD and ONLINE_CONSISTENCY_TOKEN_SECRET come from the recsys-secrets Secret,
  # never this ConfigMap.
  MYSQL_ENABLED: "false"
  # sslMode=VERIFY_IDENTITY is required, not decorative: Connector/J defaults to PREFERRED, which
  # falls back to plaintext without error and verifies no certificate. MySqlConnectionSettings
  # refuses to construct without it when MYSQL_ENABLED=true.
  MYSQL_URL: "jdbc:mysql://mysql:3306/recsys?sslMode=VERIFY_IDENTITY"
  MYSQL_USER: "recsys"
  # Outbox relay + reconciliation share these Kafka settings.
  OUTBOX_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  OUTBOX_KAFKA_ONLINE_TOPIC: "online-events"
  OUTBOX_DELIVERY_DEADLINE_MS: "5000"
  # Reconciliation CronJob. Ships in report-only mode: RECONCILIATION_REPAIR flips to "true"
  # only after the report-only counters have been observed for the agreed window.
  RECONCILIATION_WINDOW_HOURS: "24"
  RECONCILIATION_MAX_BATCH: "500"
  RECONCILIATION_REPAIR: "false"
  RECONCILIATION_LEASE_SECONDS: "300"
  # Durable online API acceptance + consistency tokens. OFF by default; enabling requires
  # MYSQL_ENABLED=true and the ONLINE_CONSISTENCY_TOKEN_SECRET Secret (>=32 UTF-8 bytes).
  ONLINE_DURABLE_EVENTS_ENABLED: "false"
  # Outbox relay Deployment tuning. OUTBOX_RELAY_POLL_MS is the claim cadence; the per-send and
  # relay-cycle deadline is OUTBOX_DELIVERY_DEADLINE_MS above.
  OUTBOX_RELAY_PORT: "7020"
  OUTBOX_RELAY_BATCH_SIZE: "100"
  OUTBOX_RELAY_MAX_CONCURRENT_SENDS: "16"
  OUTBOX_RELAY_LEASE_SECONDS: "30"
  OUTBOX_RELAY_POLL_MS: "500"
  OUTBOX_RELAY_MAX_ATTEMPTS: "8"
  OUTBOX_RELAY_READINESS_MAX_BACKLOG: "100000"
