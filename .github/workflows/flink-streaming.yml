# Gate for the Flink online-feature job (com.recsys.online.flink), which no other workflow builds.
#
# The Flink sources compile only under -Pstreaming-flink. resilience-pr runs -Presilience, and
# resilience-scheduled's docker job runs -Dgroups=docker without the profile, so neither compiles
# them. KafkaFlinkPartitionIntegrationTest's "rescaled restore" never actually restored (#346),
# and nothing noticed, because no CI job ran it.
#
# -Denforcer.skip=true: the profile has pre-existing dependency-convergence errors (kryo,
# kafka-clients). KafkaFlinkPartitionLoadTest stays excluded: its throughput floor is valid only
# on the host it was calibrated for.
name: flink-streaming

on:
  pull_request:
    paths:
      - "src/main/java/com/recsys/online/flink/**"
      - "src/test/java/com/recsys/online/flink/**"
      - "src/main/java/com/recsys/infrastructure/redis/StreamingRedisUri.java"
      - "pom.xml"
      - "scripts/check-surefire-ran.sh"
      - ".github/workflows/flink-streaming.yml"
  schedule:
    - cron: "41 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flink:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test the guard script
        run: bash scripts/test-check-surefire-ran.sh
      - name: Run Flink job tests
        run: >-
          mvn --batch-mode test
          -Pstreaming-flink
          -Denforcer.skip=true
          -DexcludedGroups=load
          -Dtest='com/recsys/online/flink/**'
          -Dsurefire.failIfNoSpecifiedTests=false
      # These classes skip themselves without Docker, and Maven counts a skip as a pass.
      - name: Require the Docker-backed tests to have run
        if: always()
        run: >-
          scripts/check-surefire-ran.sh target/surefire-reports
          com.recsys.online.flink.OnlineFeatureStreamingJobTest
          com.recsys.online.flink.KafkaFlinkPartitionIntegrationTest
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flink-streaming-reports
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 30
