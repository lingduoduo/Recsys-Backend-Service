# Replica StatefulSet — 2 replicas spread across AZs; no PVC (rebuilt from primary)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-replica
  namespace: recsys
spec:
  serviceName: redis-replica-headless
  replicas: 2
  selector:
    matchLabels:
      app: redis
      role: replica
  template:
    metadata:
      labels:
        app: redis
        role: replica
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: redis
                topologyKey: topology.kubernetes.io/zone
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - "--replicaof"
            - "redis-primary"
            - "6379"
            - "--maxmemory"
            - "200mb"
            # volatile-lru, not allkeys: everything cache-like carries an explicit TTL, so
            # the no-TTL keys are the authoritative ones (shard:topology, seeded
            # embeddings). Evicting those silently resets a resharded cluster to
            # generation 1. Memory pressure must degrade the cache and then fail loudly,
            # not corrupt state.
            - "--maxmemory-policy"
            - "volatile-lru"
            - "--requirepass"
            - "$(REDIS_PASSWORD)"
            # The replica authenticates TO the primary with this. Without it the replication
            # stream is rejected and the replica serves indefinitely stale reads rather than
            # failing — the most expensive way for this change to go wrong.
            - "--masterauth"
            - "$(REDIS_PASSWORD)"
            # ACL users, one per workload — see k8s/base/redis-users.acl.template. Rules are
            # passed as a file rather than as `--user` arguments because a user rule carries its
            # password inline, and this manifest already refuses to put a credential in the
            # process table (see REDISCLI_AUTH below). Read-only is sufficient: nothing calls
            # ACL SAVE, so the file is only ever read at startup.
            #
            # The template itself carries no comments: Redis aborts startup on any non-blank
            # ACL-file line that doesn't start with `user` — measured against a real
            # redis-server, not assumed — so a `#` header line CrashLoops both StatefulSets.
            # This is where that rationale lives instead.
            #
            # `user default` is the template's first line and must stay. Omitting it does not
            # leave --requirepass above governing the default user: ACLLoadFromFile rebuilds a
            # missing default as `on nopass ~* &* +@all`, which silently re-enables
            # unauthenticated access (measured: ACL LIST shows nopass, the log warns Redis does
            # not require authentication, and `redis-cli ping` with no auth returns PONG) and
            # also breaks replication and Flink, both of which authenticate as default — while
            # both readiness/liveness ping probes stay green throughout.
            #
            # catalog, model and online all carry +@scripting. It is in neither @read nor
            # @write, and without it EVAL fails on the trending read path (ShardedTopKStore),
            # the sharded record write, topology publish, the online rate limiter, and the
            # submit-token consume — all of which run as Lua scripts.
            #
            # topk: keys are granted `~` (full read-write) rather than `%R~` for all three
            # serving users, even though the access is logically read-only: Redis requires full
            # read-write permission on every key an EVAL script touches, even a script whose
            # shebang declares `#!lua flags=no-writes`. `%R~` there fails every trending EVAL
            # with NOPERM. Also measured.
            #
            # Prefix coverage was swept from the actual callers, not guessed: catalog also
            # writes u2vEmb:* (RecSysServer.seedEmbeddings, not just i2vEmb:*); online and
            # model both read user:*:recent_movies; and rate:online:*, submit_token:*, and
            # login:* were each missing from an earlier, partial pass.
            - "--aclfile"
            - "/etc/redis/users.acl"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: recsys-secrets
                  key: redis-password
                  optional: true
            # redis-cli reads REDISCLI_AUTH from the environment. A -a flag on the probe command
            # would put the password in the process table and in probe failure output.
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: recsys-secrets
                  key: redis-password
                  optional: true
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-acl
              mountPath: /etc/redis
              readOnly: true
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 384Mi
      volumes:
        - name: redis-acl
          secret:
            secretName: recsys-secrets
            items:
              - key: redis-users.acl
                path: users.acl
