services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 | grep -q 'Zookeeper version'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  redis-primary:
    image: redis:7-alpine
    container_name: redis-primary
    ports:
      - "6379:6379"
    # volatile-lru, not allkeys-lru: cache-like keys all carry an explicit TTL, so the
    # no-TTL keys are the authoritative ones (shard:topology, seeded embeddings) and must
    # never be eviction candidates. Mirrors k8s/base/redis-cluster.yaml.
    command: >
      redis-server
      --save 900 1
      --save 300 10
      --maxmemory 200mb
      --maxmemory-policy volatile-lru
    volumes:
      - redis-primary-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-replica:
    image: redis:7-alpine
    container_name: redis-replica
    # 6379 on the host is the primary's; the replica takes the conventional second Redis port.
    ports:
      - "6380:6379"
    # See the primary above: eviction is confined to TTL-bearing keys.
    command: >
      redis-server
      --replicaof redis-primary 6379
      --maxmemory 200mb
      --maxmemory-policy volatile-lru
    depends_on:
      redis-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-sentinel-1:
    image: redis:7-alpine
    container_name: redis-sentinel-1
    # 26379 is the REDIS_SENTINEL_NODES default, so sentinel 1 holds it.
    ports:
      - "26379:26379"
    volumes:
      - ./docker/redis/sentinel.conf:/etc/redis/sentinel-template.conf:ro
      - redis-sentinel-1-data:/data
    command: >
      sh -c "cp /etc/redis/sentinel-template.conf /data/sentinel.conf && redis-sentinel /data/sentinel.conf"
    depends_on:
      redis-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-sentinel-2:
    image: redis:7-alpine
    container_name: redis-sentinel-2
    ports:
      - "26380:26379"
    volumes:
      - ./docker/redis/sentinel.conf:/etc/redis/sentinel-template.conf:ro
      - redis-sentinel-2-data:/data
    command: >
      sh -c "cp /etc/redis/sentinel-template.conf /data/sentinel.conf && redis-sentinel /data/sentinel.conf"
    depends_on:
      redis-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-sentinel-3:
    image: redis:7-alpine
    container_name: redis-sentinel-3
    ports:
      - "26381:26379"
    volumes:
      - ./docker/redis/sentinel.conf:/etc/redis/sentinel-template.conf:ro
      - redis-sentinel-3-data:/data
    command: >
      sh -c "cp /etc/redis/sentinel-template.conf /data/sentinel.conf && redis-sentinel /data/sentinel.conf"
    depends_on:
      redis-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  jobmanager:
    image: flink:1.18
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=jobmanager
      # FLINK_CHECKPOINT_DIR is read by the job's main() on the client side (e.g. mvn exec:java).
      # Pass --checkpoint-dir=<path> as a CLI arg to flink run, or set this var on the submitting machine.
      - FLINK_CHECKPOINT_DIR=/tmp/flink-checkpoints
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/overview"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  taskmanager:
    image: flink:1.18
    depends_on:
      jobmanager:
        condition: service_healthy
    command: taskmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=jobmanager
      - TASK_MANAGER_NUMBER_OF_TASK_SLOTS=4
      # FLINK_CHECKPOINT_DIR is read by the job's main() on the client side (e.g. mvn exec:java).
      # Pass --checkpoint-dir=<path> as a CLI arg to flink run, or set this var on the submitting machine.
      - FLINK_CHECKPOINT_DIR=/tmp/flink-checkpoints

volumes:
  redis-primary-data:
  redis-sentinel-1-data:
  redis-sentinel-2-data:
  redis-sentinel-3-data:
