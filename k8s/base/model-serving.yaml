apiVersion: apps/v1
kind: Deployment
metadata:
  name: recsys-model-serving
  namespace: recsys
  labels:
    app: recsys-model-serving
spec:
  replicas: 3
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 2
  selector:
    matchLabels:
      app: recsys-model-serving
  template:
    metadata:
      labels:
        app: recsys-model-serving
      annotations:
        # Annotation-based scraping disabled — ServiceMonitor (k8s/base/servicemonitor.yaml) is the authoritative discovery path.
        # Set to "true" only in environments without the Prometheus Operator.
        prometheus.io/scrape: "false"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: recsys-model-serving
      containers:
        - name: model-serving
          image: recsys-backend-service:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: recsys-config
          env:
            - name: RECSYS_MAIN_CLASS
              value: com.recsys.api.rest.ModelApplication
            - name: SERVER_PORT
              value: "8080"
            # -XX:+ExitOnOutOfMemoryError: an OOM'd JVM keeps serving (500s, then 200s once GC
            # recovers) with no liveness probe that notices, so nothing restarts it. Exiting
            # skips the graceful drain deliberately — see 18_Fault_Tolerance.md §9.5.
            - name: JAVA_OPTS
              value: "-Xms1g -Xmx2g -XX:MaxDirectMemorySize=512m -XX:+ExitOnOutOfMemoryError"
            - name: MANAGEMENT_ENDPOINTS_EXPOSURE
              value: "health,info,prometheus"
            # ONNX Runtime native parallelism, stated explicitly rather than inherited. One
            # intra-op thread, one inter-op thread, sequential graph execution: the pod's CPU
            # limit is 2 and the request path already parallelises ACROSS requests (the
            # RECSYS_HEALTH_MAX_CONCURRENT_REQUESTS admission cap in the ConfigMap), so letting
            # each OrtSession.run spin up its own thread pool oversubscribes the limit and
            # shows up as throttling, not throughput. Safety defaults, not capacity claims —
            # change only with InferenceLoadTest numbers from the same CPU shape. Pinned by
            # ModelServingManifestTest.
            - name: RECSYS_MODEL_ONNX_INTRA_OP_THREADS
              value: "1"
            - name: RECSYS_MODEL_ONNX_INTER_OP_THREADS
              value: "1"
            - name: RECSYS_MODEL_ONNX_EXECUTION_MODE
              value: "SEQUENTIAL"
            # Readiness thresholds. application.yml ships demo values (0.5 failure rate, 2000ms
            # average latency) that would keep a badly degraded instance in rotation; these are
            # the production numbers. Both are ${...} placeholders in application.yml on
            # purpose — Spring relaxed binding does NOT map RECSYS_HEALTH_MAX_FAILURE_RATE to
            # max-failure-rate on its own.
            - name: RECSYS_HEALTH_MAX_FAILURE_RATE
              value: "0.05"
            - name: RECSYS_HEALTH_MAX_AVG_LATENCY_MS
              value: "500"
            - name: RECOMMENDATION_CURSOR_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: recsys-secrets
                  key: recommendation-cursor-signing-key
            - name: RECOMMENDATION_CURSOR_PREVIOUS_KEY
              valueFrom:
                secretKeyRef:
                  name: recsys-secrets
                  key: recommendation-cursor-previous-key
                  optional: true
            # Splunk HEC log shipping. Inert until the recsys-splunk Secret exists, so
            # optional: true keeps pods schedulable before it is provisioned — same pattern
            # as recsys-online-admin / SHARD_ADMIN_TOKEN. See
            # docs/runbooks/splunk-hec-logging.md.
            - name: SPLUNK_SERVICE_NAME
              value: "model-serving"
            - name: SPLUNK_HEC_URL
              value: "http://splunk:8088/services/collector/event"
            - name: SPLUNK_HEC_TOKEN
              valueFrom:
                secretKeyRef:
                  name: recsys-splunk
                  key: hec-token
                  optional: true
            # Authenticates as the `model` ACL user, not `default`. See
            # k8s/base/redis-users.acl.template for what this user may write. Unset falls back to
            # a legacy default-user AUTH (LettuceClientFactory:220), so a cluster whose Secret
            # predates the ACL rollout keeps working rather than failing closed at startup.
            - name: REDIS_USERNAME
              value: "model"
            # Redis AUTH. optional: true keeps the pod schedulable before the Secret exists —
            # LettuceClientFactory then refuses to start with a message naming this key, which is
            # a readable failure rather than a pod stuck Pending with an empty log.
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: recsys-secrets
                  key: redis-model-password
                  optional: true
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            failureThreshold: 36
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 3Gi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: recsys-model-serving
  namespace: recsys
  labels:
    app: recsys-model-serving
spec:
  type: ClusterIP
  selector:
    app: recsys-model-serving
  ports:
    - name: http
      port: 8080
      targetPort: http
