apiVersion: v1
kind: Service
metadata:
  name: redis-sentinel-headless
  namespace: recsys
spec:
  clusterIP: None
  selector:
    app: redis-sentinel
  ports:
    - name: sentinel
      port: 26379
      targetPort: 26379
---
# Sentinel StatefulSet — 3 replicas; init container copies config to writable emptyDir
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-sentinel
  namespace: recsys
spec:
  serviceName: redis-sentinel-headless
  replicas: 3
  selector:
    matchLabels:
      app: redis-sentinel
  template:
    metadata:
      labels:
        app: redis-sentinel
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: redis-sentinel
                topologyKey: topology.kubernetes.io/zone
      initContainers:
        - name: copy-sentinel-config
          image: redis:7-alpine
          # sed rather than cp: the template lives in a ConfigMap, which cannot hold the password,
          # so the placeholder is substituted from the environment at startup.
          command:
            - sh
            - -c
            - sed "s|__REDIS_PASSWORD__|$REDIS_PASSWORD|" /etc/redis/sentinel-template.conf > /data/sentinel.conf
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: recsys-secrets
                  key: redis-password
                  optional: true
          volumeMounts:
            - name: sentinel-config-template
              mountPath: /etc/redis
            - name: sentinel-data
              mountPath: /data
      containers:
        - name: sentinel
          image: redis:7-alpine
          command: ["redis-sentinel", "/data/sentinel.conf"]
          env:
            # redis-cli reads REDISCLI_AUTH from the environment. A -a flag on the probe command
            # would put the password in the process table and in probe failure output.
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: recsys-secrets
                  key: redis-password
                  optional: true
          ports:
            - containerPort: 26379
          volumeMounts:
            - name: sentinel-data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "-p", "26379", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "-p", "26379", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: sentinel-config-template
          configMap:
            name: redis-sentinel-config
        - name: sentinel-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis-sentinel
  namespace: recsys
spec:
  type: ClusterIP
  selector:
    app: redis-sentinel
  ports:
    - name: sentinel
      port: 26379
      targetPort: 26379
---
# REDIS_HOST is "redis" in the ConfigMap, but until this Service existed that name resolved to
# nothing in-cluster. It was inert only because REDIS_MODE is "sentinel", so
# LettuceClientFactory takes the sentinel path and ignores the standalone host. The EKS
# overlays set REDIS_SENTINEL_MASTER: "" and rely on REDIS_HOST, so the standalone path IS
# live in production — and any base-shaped deployment that flips REDIS_MODE would fail on DNS
# resolution before NetworkPolicy ever entered the picture.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: recsys
spec:
  type: ClusterIP
  selector:
    app: redis
    # Primary only. REDIS_HOST is the standalone path's read-AND-write endpoint, and `app: redis`
    # alone also matches the two replicas — writes would round-robin onto a read-only replica and
    # fail intermittently, which is a worse failure than the DNS error this Service replaced.
    role: primary
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
