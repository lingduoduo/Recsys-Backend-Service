# resolve-hostnames defaults to "no", which makes a hostname in `sentinel monitor` a fatal
# config error ("Can't resolve instance hostname") rather than a lookup. Compose gives us
# `redis-primary` as a DNS name and no stable IP to hardcode, so this must be yes or every
# Sentinel in this stack exits 1 on startup.
sentinel resolve-hostnames yes
sentinel monitor mymaster redis-primary 6379 2
sentinel down-after-milliseconds mymaster 5000
sentinel failover-timeout mymaster 30000
sentinel parallel-syncs mymaster 1
